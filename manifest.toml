#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "flus"
name = "Flus"
description.en = "Aggregate, save and share links from all over the Web"
description.fr = "Agréger, enregistrer et partager des liens de partout sur le Web"

version = "3.0.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://flus.fr/"
demo = "https://demo.flus.fr/"
code = "https://github.com/flusio/Flus"
fund = "https://flus.fr/tarifs"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/flus"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

    [resources.sources.main]

    url = "https://github.com/flusio/Flus/archive/refs/tags/v3.0.1.tar.gz"
    sha256 = "150d18a99d8a3bf64723658cd0e20c4cae40400d2ee4a456473dd1718c821230"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql, php8.5-gettext, php8.5-gd, php8.5-intl, php8.5-pgsql, php8.5-cli"

    [resources.database]
    type = "postgresql"

    #[resources.composer]
    #version = "2.10.3"
